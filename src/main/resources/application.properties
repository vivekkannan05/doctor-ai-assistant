# ==================== DATABASE ====================
# H2 file-based database (persists between restarts)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/clinicdb;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Auto-create tables from entity classes, load import.sql on startup
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# ==================== OPENAI ====================
# Read API key from environment variable - NEVER hardcode this
openai.api.key=${OPENAI_API_KEY:not-set}

# ==================== QUARKUS MODE ====================
# Run as CLI app (command mode), not as a web server
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.log.category."com.clinic".level=DEBUG
